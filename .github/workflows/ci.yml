name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / build / regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Workspace binding regression
        run: npm run test:workspace

      - name: Runtime policy regression
        run: npm run test:runtime-policy

      - name: CognoNexus governance regression
        run: npm run test:cogno

      - name: CognoNexus edge observation
        run: npm run test:cogno:edge

      - name: Topic drawer layout regression
        run: npm run test:layout

  rust:
    name: Rust protocol / MCP crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test protocol crate
        run: cargo test -p shadow-crew-protocol

      - name: Test dev MCP crate
        run: cargo test -p shadow-crew-dev-mcp
