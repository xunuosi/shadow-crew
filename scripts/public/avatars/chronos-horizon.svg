<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-chronos-horizon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1608"/>
      <stop offset="100%" stop-color="#0c0903"/>
    </radialGradient>
    <radialGradient id="glow-chronos-horizon" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.68"/>
      <stop offset="65%" stop-color="#eab308" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外层深空圆章底盘 -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-chronos-horizon)" stroke="#713f12" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#713f12" stroke-width="1.2" stroke-opacity="0.65"/>
  <!-- 中心星云径向发光层 -->
  <circle cx="100" cy="100" r="76" fill="url(#glow-chronos-horizon)"/>
  <!-- 抽象神话与宇宙几何切面 -->
  
        <ellipse cx="100" cy="100" rx="72" ry="26" transform="rotate(-28 100 100)" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.65"/>
        <ellipse cx="100" cy="100" rx="72" ry="26" transform="rotate(-28 100 100)" fill="none" stroke="#ffffff" stroke-width="1.4"/>
        <polygon points="64,42 136,42 100,100 136,158 64,158 100,100" fill="#eab308" fill-opacity="0.72" stroke="#ffffff" stroke-width="1.8"/>
      
  <!-- 标志性虚线星轨环与中心白炽奇点 -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.92"/>
  <circle cx="100" cy="100" r="7.5" fill="#ffffff"/>
</svg>