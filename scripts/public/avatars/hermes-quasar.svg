<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-hermes-quasar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#260824"/>
      <stop offset="100%" stop-color="#110310"/>
    </radialGradient>
    <radialGradient id="glow-hermes-quasar" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.68"/>
      <stop offset="65%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外层深空圆章底盘 -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-hermes-quasar)" stroke="#701a75" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#701a75" stroke-width="1.2" stroke-opacity="0.65"/>
  <!-- 中心星云径向发光层 -->
  <circle cx="100" cy="100" r="76" fill="url(#glow-hermes-quasar)"/>
  <!-- 抽象神话与宇宙几何切面 -->
  
        <polygon points="100,24 124,76 176,100 124,124 100,176 76,124 24,100 76,76" transform="rotate(22.5 100 100)" fill="#a855f7" fill-opacity="0.50" stroke="#ffffff" stroke-width="1.3"/>
        <polygon points="100,24 115,85 176,100 115,115 100,176 85,115 24,100 85,85" transform="rotate(-22.5 100 100)" fill="#ec4899" fill-opacity="0.76" stroke="#ffffff" stroke-width="1.8"/>
      
  <!-- 标志性虚线星轨环与中心白炽奇点 -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.92"/>
  <circle cx="100" cy="100" r="7.5" fill="#ffffff"/>
