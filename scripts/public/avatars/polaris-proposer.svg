<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-polaris-proposer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#030914"/>
    </radialGradient>
    <radialGradient id="glow-polaris-proposer" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.68"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外层深空圆章底盘 -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-polaris-proposer)" stroke="#164e63" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#164e63" stroke-width="1.2" stroke-opacity="0.65"/>
  <!-- 中心星云径向发光层 -->
  <circle cx="100" cy="100" r="76" fill="url(#glow-polaris-proposer)"/>
  <!-- 抽象神话与宇宙几何切面 -->
  
        <polygon points="100,24 116,84 176,100 116,116 100,176 84,116 24,100 84,84" fill="#06b6d4" fill-opacity="0.72" stroke="#ffffff" stroke-width="1.8"/>
        <polygon points="100,40 112,88 160,100 112,112 100,160 88,112 40,100 88,88" transform="rotate(45 100 100)" fill="#3b82f6" fill-opacity="0.52" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8"/>
      
  <!-- 标志性虚线星轨环与中心白炽奇点 -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.92"/>
  <circle cx="100" cy="100" r="7.5" fill="#ffffff"/>
